# Sacred-text topic catalog for DocKG
#
# Used with parse_corpus(topics_file_map={"sacred-texts/": "..."}) to route
# verse-structured documents through a domain-appropriate topic classifier.
#
# Format: flat mapping of topic_name -> list of keywords.
# All matching is case-insensitive; multi-word phrases are matched as substrings.
#
# Coverage:
#   Creation      — cosmogony, origins, making
#   Covenant      — promises, oaths, blood rites, signs
#   Law           — commandments, statutes, ordinances
#   Prophecy      — oracles, visions, thus-saith formulae
#   Gospel        — Jesus, kingdom preaching, salvation
#   Epistle       — Pauline/general letter rhetoric
#   Wisdom        — proverbs, practical ethics, fear of the Lord
#   Lament        — grief, affliction, complaint psalms
#   Praise        — worship, thanksgiving, hallelujah
#   Narrative     — historical prose, war, kingship
#   Apocalyptic   — visions, beasts, final judgment
#   Ethics        — love, mercy, justice, forgiveness

