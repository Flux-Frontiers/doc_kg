# pyproject.toml — DocKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Install — extras are package features, groups are repo tooling (Poetry-only)
# ----------------------------------------------------------------------------
#   pip install -e "."                   core runtime only
#   pip install -e ".[analysis,viz]"     + clustering/manifold, Streamlit/PyVis
#   pip install -e ".[lancedb]"          + legacy reader, for convert-index only
#
#   poetry install --with dev            + pytest, ruff, ty, pre-commit, pdoc
#   poetry install --with kg             + the pycodekg CLI
#   poetry install --extras "analysis viz" --with dev,kg    full maintainer env
#
# No [dev] and no [all] extra -- see the notes below. [sqlite-vec] is a no-op
# alias kept for sister packages that still pin it.
#
# Run tests
# ---------
#   pytest                          config is [tool.pytest.ini_options] below
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=doc_kg             with coverage
#
# Build KG indices (after code changes)
# --------------------------------------
#   dockg build --repo .

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "doc_kg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "doc-kg"
version = "0.22.0"
description = "A tool to build a semantically searchable knowledge graph from markdown and text documents"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "document-analysis", "markdown", "sqlite-vec", "sqlite", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    # Capped: mcp 2.0 split FastMCP into its own package, and mcp_server.py
    # imports it from `mcp` at module scope. Lift only alongside that port.
    "mcp>=1.0.0,<2",
    "pyyaml>=6.0.0",
    # Above the >=13.0.0 kgmodule-utils[semantic] carries, to match the fleet.
    "rich>=14.3.3,<15",
    # Direct (guarded) import in index.py, so declared rather than inherited.
    "tqdm>=4.60",
    # Carries the semantic stack: numpy, sentence-transformers, sqlite-vec,
    # torch, transformers. We import four of those directly, so the [semantic]
    # extra's contents are a contract -- see KG_utils/pyproject.toml.
    #
    # 0.13.2, not 0.13.1: that release made SnapshotManager's `repo_root` a
    # read-only property, which breaks every subclass that assigns it. Nothing
    # in the fleet declares a floor that can resolve to it.
    #
    # 0.18.0 is a *fleet* floor rather than a code requirement. Nothing here
    # imports `kg_utils.temporal` -- DocKG keeps its own store, and this
    # release's `metadata` column is self-contained. But the KG packages move
    # as a deliberate set, not individually, and one package floored at five
    # different versions across the fleet is precisely the drift the pin
    # standard exists to stop. A reader comparing two repos should not have to
    # work out which floor is real.
    "kgmodule-utils[semantic]>=0.18.0",
    "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
viz = [
    "pyvis>=0.3.2",
    "streamlit>=1.35.0",
]
# Topic clustering, stratified sampling and manifold analysis. Every call site
# guards the import, so the base install stays lean. Both are declared because
# both are imported directly -- they were only reaching us as transitives of
# sentence-transformers (scikit-learn) and scikit-learn (joblib).
analysis = [
    "joblib>=1.4.0",
    "scikit-learn>=1.3.0",
]
# Reads a legacy pre-0.20.0 LanceDB store. Needed for exactly one thing --
# `dockg convert-index`, which copies vectors into vectors.sqlite without
# re-embedding. Install it, convert, and you are done with it.
#
#   pip install 'doc-kg[lancedb]'
#   dockg convert-index --repo . --delete-lancedb
lancedb = [
    "lancedb>=0.29.0",
]
# No-op alias: sqlite-vec is core as of 0.20.0, but sister packages still pin
# `doc-kg[sqlite-vec]` (diary-kg >=0.94.0), so removing it breaks their installs.
sqlite-vec = []

# Two deliberate absences here:
#
# 1. Cross-KG siblings (pycode-kg, agent-kg, kg-rag). Never imported, and
#    declaring them makes the resolver reconcile every sibling's transformers
#    pin against ours -- historically a deadlock, since doc-kg and pycode-kg
#    each depended on the other. Install by hand: `pip install pycode-kg`.
# 2. An `all` aggregate. It pulled in the dev toolchain, and duplicating every
#    package across the marker space is what sends `poetry lock` into
#    resolution restarts. Use `--all-extras`, or name extras explicitly.
#
# NB: [lancedb] stays out of any "install everything" path regardless -- it
# only reads legacy stores, and folding it in restores the weight 0.20.0 shed.

# ---------------------------------------------------------------------------
# Maintainer tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# pycode-kg is a tool this repo *runs*, not a library it imports: the release
# workflow rebuilds the PyCodeKG index and .mcp.json serves it. Nothing under
# src/ or tests/ imports it.
#
# A group, not an extra, because groups stay out of the wheel's metadata -- so
# consumers never acquire pycode-kg or the pandas/networkx it carries, which
# 0.21.0 deliberately dropped. Safe to lock as of pycode-kg 0.21.4, which no
# longer depends on doc-kg; should it reacquire one, the breakage surfaces here
# in `poetry lock` rather than downstream.
#
#   poetry install --with kg      # pycodekg CLI into .venv/bin
[tool.poetry.group.kg]
optional = true

[tool.poetry.group.kg.dependencies]
pycode-kg = ">=0.23.1"

# ---------------------------------------------------------------------------
# Dev tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# An extra is a feature of the *package*; dev tooling is a property of the
# *repo*. As `doc-kg[dev]` it handed every consumer our repo-reasoned pins
# (ruff<0.16). No pip path on purpose -- dev setups are Poetry-only across the
# fleet (kgrag_priv/docs/FLEET_STANDARDS.md).
#
#   poetry install --with dev
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
ty = ">=0.0.41"
pdoc = ">=14.0.0"
pre-commit = ">=4.5.1"
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
ruff = ">=0.4.0,<0.16"

[project.urls]
Homepage = "https://github.com/Flux-Frontiers/doc_kg"
Repository = "https://github.com/Flux-Frontiers/doc_kg"

[project.scripts]
dockg             = "doc_kg.cli.main:cli"
dockg-analyze     = "doc_kg.cli.cmd_analyze:analyze"
dockg-build       = "doc_kg.cli.cmd_build:build"
dockg-build-graph = "doc_kg.cli.cmd_build:build_graph"
dockg-build-index = "doc_kg.cli.cmd_build:build_index"
dockg-mcp         = "doc_kg.mcp_server:main"
dockg-pack        = "doc_kg.cli.cmd_query:pack"
dockg-pipeline    = "doc_kg.cli.cmd_pipeline:pipeline"
dockg-query       = "doc_kg.cli.cmd_query:query"
dockg-snapshot    = "doc_kg.cli.cmd_snapshot:snapshot"
dockg-viz         = "doc_kg.cli.cmd_viz:viz"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# ruff >=0.14 formats Python inside Markdown. Our prose snippets are
# deliberately formatted, and .kgcache holds a vendored model card we do not
# own -- keep both out of reach.
exclude = [".claude", ".kgcache", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"
# Whether a `ty: ignore` is needed depends on which extras are installed: with
# [lancedb] absent (the default since 0.20.0) ty cannot resolve LanceDB types,
# so those suppressions look unused -- yet deleting them breaks ty for anyone
# working on the converter. Silence the check, keep the suppressions.
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# PyCodeKG / DocKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
# Exclude test directories from the knowledge graph.
# Tests skew architectural metrics (fan-in, public API surface, docstring coverage)
exclude = ["tests"]
include = ["src"]

[tool.dockg]
exclude = [
    ".dockg", ".pycodekg", ".git", ".mypy_cache", "src", "venv", "benchmarks", "corpus",
]

# ---------------------------------------------------------------------------
# Poe tasks
# ---------------------------------------------------------------------------
[tool.poe.tasks.docs]
help     = "Generate project documentation and user guide PDFs"
sequence = [
    { shell = "cd src && pdoc --o ../docs --logo ./logo.png doc_kg" },
]
