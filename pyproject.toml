# pyproject.toml — DocKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
# Last Revision: 2026-05-03
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Quick install (pip)
# -------------------
#   pip install -e ".[dev]"             core + dev tools (pytest, ruff, mypy, etc.)
#   pip install -e ".[viz]"             core + Streamlit/Plotly/PyVis visualizer
#   pip install -e ".[kgdeps]"          core + KG integrations (pycode-kg, kg-rag)
#   pip install -e ".[all]"             everything above
#   pip install -e "."                  core runtime only
#
# Quick install (poetry)
# ----------------------
#   poetry install --all-extras         everything
#   poetry install --extras "dev"       core + dev tools only
#   poetry install --extras "viz"       core + Streamlit/Plotly visualizer only
#   poetry install --extras "kgdeps"    core + KG integrations only
#   poetry install                      core runtime only
#
# First-time setup
# ----------------
#   python -m venv .venv
#   source .venv/bin/activate       # Windows: .venv\Scripts\activate
#   pip install -e ".[dev]"
#
# Run tests
# ---------
#   pytest                          uses pytest.ini (testpaths = tests/)
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=doc_kg             with coverage
#
# Build KG indices (after code changes)
# --------------------------------------
#   dockg build --repo .

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "doc_kg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "doc-kg"
version = "0.15.0"
description = "A tool to build a semantically searchable knowledge graph from markdown and text documents"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@mac.com" }
]
keywords = ["knowledge-graph", "document-analysis", "markdown", "lancedb", "sqlite", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    "einops>=0.8.2",
    "lancedb>=0.29.0",
    "markdown-it-py>=3.0.0",
    "mcp>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0,<15.0.0",
    "sentence-transformers>=5.4.1",
    "transformers>=4.40.0,<4.57",
    "kgmodule-utils>=0.2.0",
    "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=1.10.0",
    "pdoc>=14.0.0",
    "pre-commit>=4.5.1",
    "pylint>=4.0.5",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pycode-kg>=0.16.0",
]
viz = [
    "plotly>=5.14.0",
    "pyvis>=0.3.2",
    "streamlit>=1.35.0",
]

# pycode-kg is on PyPI; kg-rag and agent-kg are not yet — install manually:
#   pip install git+https://github.com/Flux-Frontiers/KGRAG.git
#   pip install git+https://github.com/Flux-Frontiers/agent_kg.git
kgdeps = [
    "pycode-kg>=0.16.0",
]
all = [
    "detect-secrets>=1.5.0",
    "mypy>=1.10.0",
    "pdoc>=14.0.0",
    "plotly>=5.14.0",
    "pre-commit>=4.5.1",
    "pylint>=4.0.5",
    "pycode-kg>=0.16.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyvis>=0.3.2",
    "ruff>=0.4.0",
    "streamlit>=1.35.0",
]

[project.urls]
Homepage = "https://github.com/Flux-Frontiers/doc_kg"
Repository = "https://github.com/Flux-Frontiers/doc_kg"

[project.scripts]
dockg             = "doc_kg.cli.main:cli"
dockg-analyze     = "doc_kg.cli.cmd_analyze:analyze"
dockg-build       = "doc_kg.cli.cmd_build:build"
dockg-build-graph = "doc_kg.cli.cmd_build:build_graph"
dockg-build-index = "doc_kg.cli.cmd_build:build_index"
dockg-mcp         = "doc_kg.mcp_server:main"
dockg-pack        = "doc_kg.cli.cmd_query:pack"
dockg-pipeline    = "doc_kg.cli.cmd_pipeline:pipeline"
dockg-query       = "doc_kg.cli.cmd_query:query"
dockg-snapshot    = "doc_kg.cli.cmd_snapshot:snapshot"
dockg-viz         = "doc_kg.cli.cmd_viz:viz"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version        = "3.12"
strict                = false
ignore_missing_imports = true
mypy_path             = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "broad-exception-caught",   # W0718
    "cell-var-from-loop",       # W0640
    "cyclic-import",            # R0401
    "import-outside-toplevel",  # C0415
    "undefined-variable",       # E0602
]

# ---------------------------------------------------------------------------
# PyCodeKG / DocKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
# Exclude test directories from the knowledge graph.
# Tests skew architectural metrics (fan-in, public API surface, docstring coverage)
exclude = ["tests"]
include = ["src"]

[tool.dockg]
exclude = [
    ".dockg", ".pycodekg", ".git", ".mypy_cache", "src", "venv", "benchmarks", "corpus",
]

# ---------------------------------------------------------------------------
# Poe tasks
# ---------------------------------------------------------------------------
[tool.poe.tasks.docs]
help     = "Generate project documentation and user guide PDFs"
sequence = [
    { shell = "cd src && pdoc --o ../docs --logo ./logo.png doc_kg" },
]
