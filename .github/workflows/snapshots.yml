name: Temporal Snapshots

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  snapshot:
    name: Capture Metrics Snapshot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: snapshot-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Build DocKG database
        run: poetry run dockg build --wipe

      - name: Get version and commit info
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          TREE_HASH=$(git write-tree)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tree_hash=${TREE_HASH}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Capture DocKG snapshot
        run: |
          poetry run dockg snapshot save "${{ steps.version.outputs.version }}" \
            --repo . \
            --tree-hash "${{ steps.version.outputs.tree_hash }}" \
            --branch "${{ steps.version.outputs.branch }}"

      - name: Commit snapshot to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .dockg/snapshots/
          git diff --cached --quiet || git commit -m "chore(snapshot): capture DocKG metrics snapshot [skip ci]"
          git push
